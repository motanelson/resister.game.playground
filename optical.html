<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Path - Optics Puzzle Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin: 0 0 5px 0;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
        }
        p {
            margin: 0 0 15px 0;
            color: #8b949e;
            font-size: 14px;
        }
        #game-container {
            position: relative;
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 20px rgba(88,166,255,0.1);
            border: 1px solid #30363d;
        }
        canvas {
            display: block;
            background: #090d13;
            border-radius: 8px;
            cursor: pointer;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            width: 100%;
        }
        .stats {
            font-size: 15px;
            font-weight: 600;
        }
        .stats span {
            color: #58a6ff;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #30363d;
            border-color: #8b949e;
            color: #fff;
        }
        button.primary {
            background: #238636;
            border-color: #2ea043;
            color: #fff;
        }
        button.primary:hover {
            background: #2ea043;
        }
        .instructions {
            margin-top: 15px;
            font-size: 12px;
            color: #6e7681;
            text-align: center;
            max-width: 480px;
        }
    </style>
</head>
<body>

    <h1>Lumen Path</h1>
    <p>Guide the optical laser to the receiver target using mirrors.</p>

    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="480"></canvas>
        <div class="ui-panel">
            <div class="stats">
                Level: <span id="lvl-display">1</span> | Mirrors Left: <span id="mirror-count">0</span>
            </div>
            <div class="controls">
                <button onclick="resetLevel()">Reset</button>
                <button id="next-btn" class="primary" style="display:none;" onclick="nextLevel()">Next Level</button>
            </div>
        </div>
    </div>

    <div class="instructions">
        💡 <b>How to play:</b> Click any valid cell to place a <b>/</b> mirror. Click again to rotate to <b>\</b>. Click a 3rd time to remove it.
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 8;
const CELL_SIZE = canvas.width / GRID_SIZE;

// Level Definitions:
// 0: Empty, 1: Wall/Blocker
// emitter: {x, y, dir: {x, y}}
// receiver: {x, y}
// maxMirrors: Allowed placement count
const LEVELS = [
    {
        emitter: { x: 0, y: 1, dir: { x: 1, y: 0 } },
        receiver: { x: 5, y: 6 },
        walls: [
            {x: 2, y: 1}, {x: 3, y: 1}, {x: 4, y: 1},
            {x: 2, y: 4}, {x: 3, y: 4}, {x: 4, y: 4}
        ],
        maxMirrors: 4
    },
    {
        emitter: { x: 1, y: 0, dir: { x: 0, y: 1 } },
        receiver: { x: 6, y: 1 },
        walls: [
            {x: 1, y: 3}, {x: 3, y: 3}, {x: 5, y: 3},
            {x: 2, y: 5}, {x: 4, y: 5}, {x: 6, y: 5}
        ],
        maxMirrors: 5
    },
    {
        emitter: { x: 0, y: 6, dir: { x: 1, y: 0 } },
        receiver: { x: 7, y: 1 },
        walls: [
            {x: 3, y: 6}, {x: 5, y: 6}, {x: 5, y: 4},
            {x: 2, y: 2}, {x: 3, y: 2}, {x: 4, y: 2}
        ],
        maxMirrors: 6
    }
];

let currentLevelIdx = 0;
let userMirrors = {}; // Key: "x,y", Value: 1 ('/') or 2 ('\')
let isLevelCompleted = false;

function getCurrentLevel() {
    return LEVELS[currentLevelIdx];
}

function resetLevel() {
    userMirrors = {};
    isLevelCompleted = false;
    document.getElementById('next-btn').style.display = 'none';
    updateUI();
    draw();
}

function nextLevel() {
    if (currentLevelIdx < LEVELS.length - 1) {
        currentLevelIdx++;
        resetLevel();
    } else {
        alert("🎉 Congratulations! You have solved all optical circuits!");
        currentLevelIdx = 0;
        resetLevel();
    }
}

function updateUI() {
    const lvl = getCurrentLevel();
    document.getElementById('lvl-display').innerText = currentLevelIdx + 1;
    const used = Object.keys(userMirrors).length;
    document.getElementById('mirror-count').innerText = lvl.maxMirrors - used;
}

// Check if a tile is a wall
function isWall(x, y) {
    const lvl = getCurrentLevel();
    return lvl.walls.some(w => w.x === x && w.y === y);
}

// Raytracing logic
function traceLaser() {
    const lvl = getCurrentLevel();
    let cx = lvl.emitter.x;
    let cy = lvl.emitter.y;
    let dx = lvl.emitter.dir.x;
    let dy = lvl.emitter.dir.y;

    let path = [{
        x: cx * CELL_SIZE + CELL_SIZE / 2,
        y: cy * CELL_SIZE + CELL_SIZE / 2
    }];

    let hitTarget = false;
    let steps = 0;
    const maxSteps = 60; // Prevent infinite reflection loops

    while (steps < maxSteps) {
        cx += dx;
        cy += dy;
        steps++;

        // Out of bounds
        if (cx < 0 || cx >= GRID_SIZE || cy < 0 || cy >= GRID_SIZE) {
            path.push({
                x: (cx - dx * 0.5) * CELL_SIZE + CELL_SIZE / 2,
                y: (cy - dy * 0.5) * CELL_SIZE + CELL_SIZE / 2
            });
            break;
        }

        const pointX = cx * CELL_SIZE + CELL_SIZE / 2;
        const pointY = cy * CELL_SIZE + CELL_SIZE / 2;

        // Check Wall Hit
        if (isWall(cx, cy)) {
            path.push({ x: pointX, y: pointY });
            break;
        }

        // Check Target Hit
        if (cx === lvl.receiver.x && cy === lvl.receiver.y) {
            path.push({ x: pointX, y: pointY });
            hitTarget = true;
            break;
        }

        // Check Mirror Hit
        const mirrorKey = `${cx},${cy}`;
        if (userMirrors[mirrorKey]) {
            path.push({ x: pointX, y: pointY });
            const mType = userMirrors[mirrorKey];
            
            // Mirror Type 1: /
            if (mType === 1) {
                let temp = dx;
                dx = -dy;
                dy = -temp;
            } 
            // Mirror Type 2: \
            else if (mType === 2) {
                let temp = dx;
                dx = dy;
                dy = temp;
            }
        }
    }

    return { path, hitTarget };
}

// Render Functions
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const lvl = getCurrentLevel();

    // 1. Draw Grid
    ctx.strokeStyle = '#21262d';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
    }

    // 2. Draw Obstacles / Walls
    ctx.fillStyle = '#30363d';
    for (let w of lvl.walls) {
        ctx.fillRect(w.x * CELL_SIZE + 4, w.y * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8);
        ctx.strokeStyle = '#484f58';
        ctx.strokeRect(w.x * CELL_SIZE + 4, w.y * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8);
    }

    // 3. Draw Laser Emitter
    const ex = lvl.emitter.x * CELL_SIZE + CELL_SIZE / 2;
    const ey = lvl.emitter.y * CELL_SIZE + CELL_SIZE / 2;
    ctx.fillStyle = '#ff7b72';
    ctx.beginPath();
    ctx.arc(ex, ey, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f85149';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 4. Draw Receiver Target
    const rx = lvl.receiver.x * CELL_SIZE + CELL_SIZE / 2;
    const ry = lvl.receiver.y * CELL_SIZE + CELL_SIZE / 2;
    ctx.fillStyle = isLevelCompleted ? '#3fb950' : '#8957e5';
    ctx.beginPath();
    ctx.arc(rx, ry, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = isLevelCompleted ? '#56d364' : '#a371f7';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Target inner indicator
    ctx.beginPath();
    ctx.arc(rx, ry, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // 5. Draw Mirrors
    for (let key in userMirrors) {
        const [mx, my] = key.split(',').map(Number);
        const type = userMirrors[key];
        const cx = mx * CELL_SIZE;
        const cy = my * CELL_SIZE;

        ctx.save();
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#58a6ff';
        ctx.shadowBlur = 8;

        ctx.beginPath();
        if (type === 1) { // Forward slash /
            ctx.moveTo(cx + 12, cy + CELL_SIZE - 12);
            ctx.lineTo(cx + CELL_SIZE - 12, cy + 12);
        } else if (type === 2) { // Backslash \
            ctx.moveTo(cx + 12, cy + 12);
            ctx.lineTo(cx + CELL_SIZE - 12, cy + CELL_SIZE - 12);
        }
        ctx.stroke();
        ctx.restore();
    }

    // 6. Trace & Render Laser Beam
    const { path, hitTarget } = traceLaser();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
    }

    // Glowing beam effect
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 12;
    ctx.stroke();

    // Laser core (white interior for bright laser look)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();

    // 7. Check Victory condition
    if (hitTarget && !isLevelCompleted) {
        isLevelCompleted = true;
        document.getElementById('next-btn').style.display = 'inline-block';
    }
}

// Handle Mirror Placements
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
    const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);

    const lvl = getCurrentLevel();

    // Cannot place mirrors on walls, emitters, or receivers
    if (isWall(x, y)) return;
    if (lvl.emitter.x === x && lvl.emitter.y === y) return;
    if (lvl.receiver.x === x && lvl.receiver.y === y) return;

    const key = `${x},${y}`;
    const currentType = userMirrors[key] || 0;
    const currentPlacedCount = Object.keys(userMirrors).length;

    if (currentType === 0) {
        if (currentPlacedCount < lvl.maxMirrors) {
            userMirrors[key] = 1; // '/'
        }
    } else if (currentType === 1) {
        userMirrors[key] = 2; // '\'
    } else {
        delete userMirrors[key]; // remove
    }

    isLevelCompleted = false;
    document.getElementById('next-btn').style.display = 'none';

    updateUI();
    draw();
});

// Initial boot
resetLevel();
</script>

</body>
</html>
